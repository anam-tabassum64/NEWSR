services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
    depends_on:
      - mongodb
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - newspulse-data:/data/db

volumes:
  newspulse-data: